[package]
name = "orbit-editor"
version = "0.1.0"
description = "A local-first visual editor for Astro Content Collections."
authors = ["Ravinath Rajapakshe"]
edition = "2021"

[lib]
name = "orbit_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
